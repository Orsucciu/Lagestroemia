name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libsecret-1-dev \
            libgcrypt20-dev libgpg-error-dev libepoxy-dev \
            libwayland-dev libxkbcommon-dev libatk1.0-dev \
            libatk-bridge2.0-dev libgdk-pixbuf2.0-dev \
            libpango1.0-dev libcairo2-dev libharfbuzz-dev \
            libfribidi-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxcomposite-dev libxdamage-dev \
            libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: Tar bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf lagestroemia-linux-x64.tar.gz *
          mv lagestroemia-linux-x64.tar.gz ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-linux-x64
          path: lagestroemia-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lagestroemia-linux-x64.tar.gz
