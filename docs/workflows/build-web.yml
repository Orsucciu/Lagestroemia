name: Build Web (WASM)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release --wasm
      - name: Tar bundle
        run: |
          cd build/web
          tar -czf lagestroemia-web-wasm.tar.gz *
          mv lagestroemia-web-wasm.tar.gz ../../
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-web-wasm
          path: lagestroemia-web-wasm.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lagestroemia-web-wasm.tar.gz

  deploy-pages:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release --wasm --base-href "/Lagestroemia/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
