name: lagestroemia
description: "Lagestroemia — a native cross-platform client for z.ai (Windows, Linux, Android, WebAssembly)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local database (SQLite) — works on Linux/Windows/Android via FFI, on Web via sqflite_common_ffi_web
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.4+1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secure storage for API keys
  flutter_secure_storage: ^9.2.2

  # HTTP + streaming
  dio: ^5.7.0

  # Markdown rendering
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.2

  # Syntax highlighting for code artifacts

  # File picking and file handling
  file_picker: ^8.1.6
  cross_file: ^0.3.4+2

  # i18n
  intl: any

  # Misc utilities
  uuid: ^4.5.1
  collection: ^1.18.0
  shared_preferences: ^2.3.2

  # URL launching (for opening z.ai dashboard links, OAuth flows, etc.)
  url_launcher: ^6.3.1

  # In-app webview — used ONLY for the Aliyun captcha widget in guest mode.
  # We do not wrap the chat.z.ai UI; we render the captcha SDK in a small
  # inline widget so the user can solve the challenge without leaving the
  # app. The captcha returns a `captcha_verify_param` string which is then
  # sent in the chat completion request body.
  flutter_inappwebview: ^6.1.5

  # Logging
  logging: ^1.3.0

  # Crypto (for JWT signing if needed for z.ai keys in form <id>.<secret>)
  crypto: ^3.0.6

  # JSON serialization (code-generated)
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  json_serializable: ^6.8.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.3

  # WASM-ready dart test tooling
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
