name: Build All

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libsecret-1-dev \
            libgcrypt20-dev libgpg-error-dev libepoxy-dev \
            libwayland-dev libxkbcommon-dev libatk1.0-dev \
            libatk-bridge2.0-dev libgdk-pixbuf2.0-dev \
            libpango1.0-dev libcairo2-dev libharfbuzz-dev \
            libfribidi-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxcomposite-dev libxdamage-dev \
            libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev
      - run: flutter precache --linux
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter create --platforms=linux --project-name lagestroemia --org com.lagestroemia .
      - run: flutter build linux --release
      - name: Tar
        run: cd build/linux/x64/release/bundle && tar -czf lagestroemia-linux-x64.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-linux-x64
          path: build/linux/x64/release/bundle/lagestroemia-linux-x64.tar.gz

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release
      - name: Tar
        run: cd build/web && tar -czf lagestroemia-web.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-web
          path: build/web/lagestroemia-web.tar.gz

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter create --platforms=android --project-name lagestroemia --org com.lagestroemia .
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-android-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter precache --windows
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter create --platforms=windows --project-name lagestroemia --org com.lagestroemia .
      - run: flutter build windows --release
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath lagestroemia-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-windows-x64
          path: lagestroemia-windows-x64.zip

  # Upload all artifacts to the GitHub Releases tab. Creates or updates
  # the "latest" release with all build outputs.
  release:
    needs: [build-linux, build-web, build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Download all artifacts from the build jobs
      - uses: actions/download-artifact@v4
        with:
          name: lagestroemia-linux-x64
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: lagestroemia-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        with:
          name: lagestroemia-android-apks
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: lagestroemia-windows-x64
          path: artifacts/windows

      # Rename Android APKs for clarity
      - name: Rename APKs
        run: |
          cp artifacts/android/app-armeabi-v7a-release.apk artifacts/lagestroemia-android-arm.apk
          cp artifacts/android/app-arm64-v8a-release.apk artifacts/lagestroemia-android-arm64.apk
          cp artifacts/android/app-x86_64-release.apk artifacts/lagestroemia-android-x64.apk
          cp artifacts/linux/lagestroemia-linux-x64.tar.gz artifacts/
          cp artifacts/web/lagestroemia-web.tar.gz artifacts/
          cp artifacts/windows/lagestroemia-windows-x64.zip artifacts/

      # Generate SHA256 checksums
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum lagestroemia-linux-x64.tar.gz \
                   lagestroemia-web.tar.gz \
                   lagestroemia-android-arm.apk \
                   lagestroemia-android-arm64.apk \
                   lagestroemia-android-x64.apk \
                   lagestroemia-windows-x64.zip > checksums.txt
          cat checksums.txt

      # Delete the old release assets (if any) and re-upload
      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lagestroemia (latest build from main)
          body: |
            ## Latest build from main

            Built from commit ${{ github.sha }}.

            ### Artifacts
            - **lagestroemia-linux-x64.tar.gz** — Linux x64 native binary
            - **lagestroemia-web.tar.gz** — Web bundle (JS)
            - **lagestroemia-android-arm64.apk** — Android arm64 (modern phones)
            - **lagestroemia-android-arm.apk** — Android arm (older phones)
            - **lagestroemia-android-x64.apk** — Android x86_64 (emulators)
            - **lagestroemia-windows-x64.zip** — Windows x64 binary
            - **checksums.txt** — SHA256 checksums

            ### How to install
            **Linux**: `tar xzf lagestroemia-linux-x64.tar.gz && ./lagestroemia`
            **Android**: Install the APK that matches your device architecture
            **Windows**: Unzip and run `lagestroemia.exe`
            **Web**: Serve the `web/` directory with any static file server
          files: |
            artifacts/lagestroemia-linux-x64.tar.gz
            artifacts/lagestroemia-web.tar.gz
            artifacts/lagestroemia-android-arm.apk
            artifacts/lagestroemia-android-arm64.apk
            artifacts/lagestroemia-android-x64.apk
            artifacts/lagestroemia-windows-x64.zip
            artifacts/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
