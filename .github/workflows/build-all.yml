name: Build All

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libsecret-1-dev \
            libgcrypt20-dev libgpg-error-dev libepoxy-dev \
            libwayland-dev libxkbcommon-dev libatk1.0-dev \
            libatk-bridge2.0-dev libgdk-pixbuf2.0-dev \
            libpango1.0-dev libcairo2-dev libharfbuzz-dev \
            libfribidi-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxcomposite-dev libxdamage-dev \
            libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev
      - run: flutter precache --linux
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: Tar
        run: cd build/linux/x64/release/bundle && tar -czf lagestroemia-linux-x64.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-linux-x64
          path: build/linux/x64/release/bundle/lagestroemia-linux-x64.tar.gz

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release
      - name: Tar
        run: cd build/web && tar -czf lagestroemia-web.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-web
          path: build/web/lagestroemia-web.tar.gz

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-android-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - run: flutter precache --windows
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath lagestroemia-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-windows-x64
          path: lagestroemia-windows-x64.zip
