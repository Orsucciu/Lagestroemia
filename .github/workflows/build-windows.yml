# Build the Windows desktop binary on every push to main and on tag pushes.

name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath lagestroemia-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lagestroemia-windows-x64
          path: lagestroemia-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lagestroemia-windows-x64.zip
