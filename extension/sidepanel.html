<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lagestroemia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; background: #f5f5f5;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    .header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #7C4DFF; color: white; }
    .header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    .header select { padding: 4px 8px; border: none; border-radius: 4px; font-size: 12px; background: white; color: #333; cursor: pointer; }
    .header button { padding: 4px 8px; border: none; border-radius: 4px; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 12px; }
    .header button:hover { background: rgba(255,255,255,0.3); }
    .status-bar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: #f0f0f0; font-size: 11px; color: #666; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.connected { background: #27ae60; }
    .status-dot.disconnected { background: #e74c3c; }
    #chat-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; }
    .msg-user { align-self: flex-end; }
    .msg-assistant { align-self: flex-start; }
    .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .user-bubble { background: #7C4DFF; color: white; border-bottom-right-radius: 4px; }
    .assistant-bubble { background: white; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .typing { animation: blink 1s infinite; color: #999; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    .reasoning { margin-bottom: 4px; font-size: 12px; }
    .reasoning summary { cursor: pointer; color: #888; font-style: italic; }
    .reasoning > div { margin-top: 4px; padding: 6px 8px; background: #f0f0f0; border-radius: 6px; white-space: pre-wrap; color: #555; }
    #debug-panel { display: none; flex-direction: column; height: 200px; border-top: 2px solid #7C4DFF; background: #1e1e1e; }
    #debug-log { flex: 1; overflow-y: auto; padding: 4px 8px; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; color: #ccc; }
    .debug-line { line-height: 1.4; }
    .debug-time { color: #666; }
    .input-area { display: flex; gap: 8px; padding: 8px 12px; background: white; border-top: 1px solid #e0e0e0; }
    #msg-input { flex: 1; padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 13px; font-family: inherit; resize: none; min-height: 36px; max-height: 120px; outline: none; }
    #msg-input:focus { border-color: #7C4DFF; }
    #send-btn { padding: 8px 16px; border: none; border-radius: 8px; background: #7C4DFF; color: white; font-size: 13px; font-weight: 500; cursor: pointer; align-self: flex-end; }
    #send-btn:hover { background: #651fff; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌺 Lagestroemia <span style="font-size:10px;font-weight:400;opacity:0.7">v0.4.0</span></h1>
    <select id="model-select"></select>
    <button id="clear-btn">Clear</button>
    <button id="debug-toggle">Debug</button>
  </div>
  <div class="status-bar">
    <div id="status-dot" class="status-dot disconnected"></div>
    <span id="status-text">Checking...</span>
  </div>
  <div id="chat-container"></div>
  <div id="debug-panel">
    <div id="debug-log"></div>
  </div>
  <div class="input-area">
    <textarea id="msg-input" placeholder="Type a message... (Enter to send)" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
